<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX Real Estate — Cover V3</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Space Grotesk', sans-serif;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
  }

  /* ── Two contrasting panels via clip-path ── */
  .panel-dark {
    position: absolute;
    inset: 0;
    background: #0a0a0a;
    z-index: 1;
  }

  .panel-light {
    position: absolute;
    inset: 0;
    background: #0f0f0f;
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
    z-index: 2;
  }

  /* Subtle noise texture on both panels */
  .panel-dark::after,
  .panel-light::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  /* ── The bold diagonal gold line ── */
  .diagonal-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
  }

  .diagonal-line svg {
    width: 100%;
    height: 100%;
  }

  /* ── Subtle radial glow near the diagonal ── */
  .diagonal-glow {
    position: absolute;
    width: 600px;
    height: 600px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(184, 148, 74, 0.06) 0%, transparent 70%);
    z-index: 3;
    pointer-events: none;
  }

  /* ── Logo area — upper-left ── */
  .logo-area {
    position: absolute;
    top: 80px;
    left: 70px;
    z-index: 20;
  }

  .logo-area img {
    width: 350px;
    height: auto;
    filter: drop-shadow(0 4px 30px rgba(184, 148, 74, 0.15));
  }

  /* ── Tagline under logo ── */
  .tagline {
    position: absolute;
    top: 340px;
    left: 75px;
    z-index: 20;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(184, 148, 74, 0.45);
  }

  /* ── Location — elegant serif ── */
  .location {
    position: absolute;
    top: 420px;
    left: 75px;
    z-index: 20;
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 500;
    color: #ffffff;
    letter-spacing: 1px;
    line-height: 1.2;
    max-width: 380px;
  }

  .location .city {
    display: block;
    font-size: 22px;
    font-weight: 400;
    font-style: italic;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 6px;
    letter-spacing: 3px;
  }

  /* ── 'Na prodaju' rotated along the diagonal ── */
  .tag-na-prodaju {
    position: absolute;
    top: 370px;
    left: 490px;
    z-index: 15;
    transform: rotate(-45deg);
    transform-origin: center center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #0a0a0a;
    background: linear-gradient(135deg, #d4af5a, #B8944A);
    padding: 6px 22px;
    border-radius: 2px;
  }

  /* ── Property stats — lower-right, stacked vertically ── */
  .stats {
    position: absolute;
    bottom: 200px;
    right: 90px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 28px;
  }

  .stat-item {
    text-align: right;
    position: relative;
  }

  .stat-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 72px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -2px;
  }

  .stat-number .unit {
    font-size: 30px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.35);
    margin-left: 4px;
    letter-spacing: 0;
  }

  .stat-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(184, 148, 74, 0.6);
    margin-top: 4px;
  }

  /* ── Decorative thin line separators between stats ── */
  .stat-item + .stat-item::before {
    content: '';
    position: absolute;
    top: -14px;
    right: 0;
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184, 148, 74, 0.25));
  }

  /* ── Price — extra large, gold gradient ── */
  .price-area {
    position: absolute;
    bottom: 70px;
    right: 90px;
    z-index: 20;
    text-align: right;
  }

  .price-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(184, 148, 74, 0.5);
    margin-bottom: 8px;
  }

  .price-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #d4af5a 0%, #f0d78c 40%, #B8944A 70%, #d4af5a 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Decorative corner accents ── */
  .corner-tl {
    position: absolute;
    top: 40px;
    left: 40px;
    z-index: 20;
    width: 40px;
    height: 40px;
    border-top: 1px solid rgba(184, 148, 74, 0.2);
    border-left: 1px solid rgba(184, 148, 74, 0.2);
  }

  .corner-br {
    position: absolute;
    bottom: 40px;
    right: 40px;
    z-index: 20;
    width: 40px;
    height: 40px;
    border-bottom: 1px solid rgba(184, 148, 74, 0.2);
    border-right: 1px solid rgba(184, 148, 74, 0.2);
  }

  /* ── Swipe hint — bottom-right ── */
  .swipe-hint {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.35;
  }

  .swipe-hint span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffffff;
  }

  .swipe-hint .arrow {
    display: flex;
    align-items: center;
    animation: swipeArrow 2s ease-in-out infinite;
  }

  .swipe-hint .arrow svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes swipeArrow {
    0%, 100% { transform: translateX(0); opacity: 0.5; }
    50% { transform: translateX(6px); opacity: 1; }
  }

  /* ── Floating gold particles ── */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(184, 148, 74, 0.3);
    z-index: 5;
    pointer-events: none;
  }
  .p1 { width: 3px; height: 3px; top: 200px; left: 650px; animation: float1 6s ease-in-out infinite; }
  .p2 { width: 2px; height: 2px; top: 500px; left: 400px; animation: float2 8s ease-in-out infinite; }
  .p3 { width: 4px; height: 4px; top: 700px; left: 750px; animation: float1 7s ease-in-out infinite 1s; }
  .p4 { width: 2px; height: 2px; top: 350px; left: 800px; animation: float2 5s ease-in-out infinite 0.5s; }
  .p5 { width: 3px; height: 3px; top: 850px; left: 500px; animation: float1 9s ease-in-out infinite 2s; }

  @keyframes float1 {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
    50% { transform: translateY(-15px) translateX(8px); opacity: 0.7; }
  }
  @keyframes float2 {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
    50% { transform: translateY(12px) translateX(-6px); opacity: 0.6; }
  }

  /* ── Subtle vertical line accent on the dark side ── */
  .accent-line-left {
    position: absolute;
    top: 500px;
    left: 75px;
    width: 1px;
    height: 120px;
    background: linear-gradient(180deg, transparent, rgba(184, 148, 74, 0.2), transparent);
    z-index: 20;
  }

  /* ── Small floor indicator ── */
  .floor-dot {
    position: absolute;
    bottom: 160px;
    right: 280px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .floor-dot .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #B8944A;
    box-shadow: 0 0 8px rgba(184, 148, 74, 0.4);
  }

  .floor-dot span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.3);
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Two contrasting panels -->
  <div class="panel-dark"></div>
  <div class="panel-light"></div>

  <!-- Radial glow near center -->
  <div class="diagonal-glow"></div>

  <!-- Bold diagonal gold line -->
  <div class="diagonal-line">
    <svg viewBox="0 0 1080 1080" preserveAspectRatio="none">
      <defs>
        <linearGradient id="goldGrad" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#d4af5a" stop-opacity="0.9"/>
          <stop offset="30%" stop-color="#B8944A" stop-opacity="1"/>
          <stop offset="60%" stop-color="#f0d78c" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#B8944A" stop-opacity="0.9"/>
        </linearGradient>
        <!-- Subtle glow filter for the line -->
        <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <!-- Main diagonal line -->
      <line x1="1080" y1="0" x2="0" y2="1080" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#lineGlow)"/>
      <!-- Thinner parallel accent line -->
      <line x1="1080" y1="-20" x2="-20" y2="1080" stroke="rgba(184,148,74,0.08)" stroke-width="1"/>
      <line x1="1080" y1="25" x2="25" y2="1080" stroke="rgba(184,148,74,0.05)" stroke-width="1"/>
    </svg>
  </div>

  <!-- Floating particles -->
  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>

  <!-- Corner accents -->
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <!-- Logo -->
  <div class="logo-area">
    <img src="logo-transparent.png" alt="APEX Real Estate">
  </div>

  <!-- Tagline -->
  <div class="tagline">Luxury Living</div>

  <!-- Location -->
  <div class="location" id="locationDisplay">
    Centar
    <span class="city">Novi Sad</span>
  </div>

  <!-- Vertical accent line -->
  <div class="accent-line-left"></div>

  <!-- 'Na prodaju' rotated tag on the diagonal -->
  <div class="tag-na-prodaju" id="tipDisplay">NA PRODAJU</div>

  <!-- Property stats -->
  <div class="stats">
    <div class="stat-item">
      <div class="stat-number" id="m2Display">126<span class="unit">m²</span></div>
      <div class="stat-label">Kvadratura</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" id="spratDisplay">3.<span class="unit">sprat</span></div>
      <div class="stat-label">Spratnost</div>
    </div>
    <div class="stat-item">
      <div class="stat-number" id="sobeDisplay">4<span class="unit">sob.</span></div>
      <div class="stat-label">Broj soba</div>
    </div>
  </div>

  <!-- Floor indicator dot -->
  <div class="floor-dot">
    <div class="dot"></div>
    <span id="floorHint">3. sprat</span>
  </div>

  <!-- Price -->
  <div class="price-area">
    <div class="price-label">Cena</div>
    <div class="price-value" id="cenaDisplay">185.000 €</div>
  </div>

  <!-- Swipe hint -->
  <div class="swipe-hint">
    <span>Prevuci</span>
    <div class="arrow">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════
//  APEX REAL ESTATE — EASY EDIT SECTION
// ═══════════════════════════════════════════
const nekretnina = {
    lokacija:    "Centar, Novi Sad",
    kvadratura:  "126",
    sprat:       "3.",
    sobe:        "4",
    cena:        "185.000 €",
    tip:         "Na prodaju"
};

// ── Apply data to the template ──
(function() {
    const parts = nekretnina.lokacija.split(',').map(s => s.trim());
    const loc = document.getElementById('locationDisplay');
    if (parts.length >= 2) {
        loc.innerHTML = parts[0] + '<span class="city">' + parts.slice(1).join(', ') + '</span>';
    } else {
        loc.innerHTML = nekretnina.lokacija;
    }

    document.getElementById('m2Display').innerHTML =
        nekretnina.kvadratura + '<span class="unit">m²</span>';

    document.getElementById('spratDisplay').innerHTML =
        nekretnina.sprat + '<span class="unit">sprat</span>';

    document.getElementById('sobeDisplay').innerHTML =
        nekretnina.sobe + '<span class="unit">sob.</span>';

    document.getElementById('cenaDisplay').textContent = nekretnina.cena;
    document.getElementById('tipDisplay').textContent = nekretnina.tip.toUpperCase();
    document.getElementById('floorHint').textContent = nekretnina.sprat + ' sprat';
})();
</script>
</body>
</html>
