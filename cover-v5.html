<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX Real Estate — Cover V5</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  /* ── Vertical gold accent lines on left & right margins ── */
  .margin-line {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
    z-index: 1;
  }
  .margin-line.left  { left: 60px;  background: linear-gradient(to bottom, transparent 5%, #B8944A 20%, #B8944A 80%, transparent 95%); }
  .margin-line.right { right: 60px; background: linear-gradient(to bottom, transparent 5%, #B8944A 20%, #B8944A 80%, transparent 95%); }

  /* ── Secondary thinner accent lines ── */
  .margin-line-inner {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
    z-index: 1;
    opacity: 0.2;
  }
  .margin-line-inner.left  { left: 68px;  background: linear-gradient(to bottom, transparent 10%, #B8944A 25%, #B8944A 75%, transparent 90%); }
  .margin-line-inner.right { right: 68px; background: linear-gradient(to bottom, transparent 10%, #B8944A 25%, #B8944A 75%, transparent 90%); }

  /* ── Subtle texture overlay ── */
  .texture {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(184, 148, 74, 0.008) 3px,
      rgba(184, 148, 74, 0.008) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  /* ── Main layout ── */
  .canvas {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
  }

  /* ── "Na prodaju" small-caps label ── */
  .label-na-prodaju {
    margin-top: 62px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #B8944A;
    font-variant: small-caps;
    position: relative;
    padding: 0 4px;
  }
  .label-na-prodaju::before,
  .label-na-prodaju::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40px;
    height: 1px;
    background: rgba(184, 148, 74, 0.4);
  }
  .label-na-prodaju::before { right: calc(100% + 14px); }
  .label-na-prodaju::after  { left:  calc(100% + 14px); }

  /* ── Logo ── */
  .logo-wrap {
    margin-top: 30px;
    display: flex;
    justify-content: center;
  }
  .logo-wrap img {
    width: 200px;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(184, 148, 74, 0.15));
  }

  /* ── Decorative top rule ── */
  .top-rule {
    margin-top: 32px;
    width: 520px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(184, 148, 74, 0.5), transparent);
  }

  /* ── Main headline / location ── */
  .headline-block {
    margin-top: 80px;
    text-align: center;
    padding: 0 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .headline-line {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 96px;
    line-height: 1.05;
    letter-spacing: 3px;
    color: #ffffff;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .headline-line.accent {
    color: #d4af5a;
    font-weight: 400;
  }

  .headline-rule {
    width: 260px;
    height: 1px;
    background: #B8944A;
    margin: 14px 0;
    flex-shrink: 0;
  }

  .headline-rule.short {
    width: 120px;
  }

  /* ── Subtitle / district hint ── */
  .subtitle {
    margin-top: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.35);
  }

  /* ── Property details band ── */
  .details-band {
    margin-top: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(184, 148, 74, 0.45);
    padding: 18px 0;
    width: 680px;
    position: relative;
  }

  .details-band::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(184, 148, 74, 0.1);
    pointer-events: none;
  }

  .detail-item {
    flex: 1;
    text-align: center;
    position: relative;
  }

  .detail-item:not(:last-child)::after {
    content: '';
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 1px;
    height: 28px;
    background: rgba(184, 148, 74, 0.35);
  }

  .detail-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(184, 148, 74, 0.7);
    margin-bottom: 6px;
  }

  .detail-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 400;
    color: #ffffff;
    letter-spacing: 1px;
  }

  .detail-value .unit {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    margin-left: 2px;
    vertical-align: super;
  }

  /* ── Price ── */
  .price-block {
    margin-top: 55px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .price-text {
    font-family: 'Inter', sans-serif;
    font-size: 36px;
    font-weight: 300;
    color: #ffffff;
    letter-spacing: 4px;
  }

  .price-underline {
    margin-top: 12px;
    width: 180px;
    height: 2px;
    background: linear-gradient(to right, transparent, #B8944A, transparent);
  }

  /* ── Bottom area ── */
  .bottom-area {
    position: absolute;
    bottom: 50px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 90px;
  }

  /* ── Edition / Issue style text (editorial touch) ── */
  .edition-text {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.2);
    writing-mode: vertical-lr;
    transform: rotate(180deg);
  }

  /* ── Swipe hint ── */
  .swipe-hint {
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.3;
    transition: opacity 0.3s;
  }

  .swipe-hint:hover { opacity: 0.6; }

  .swipe-text {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.7);
  }

  .swipe-arrow {
    display: flex;
    align-items: center;
    gap: 3px;
    animation: nudge 2.2s ease-in-out infinite;
  }

  .swipe-arrow span {
    display: block;
    width: 16px;
    height: 1px;
    background: rgba(184, 148, 74, 0.6);
  }

  .swipe-arrow svg {
    width: 8px;
    height: 8px;
    fill: none;
    stroke: rgba(184, 148, 74, 0.6);
    stroke-width: 1.5;
  }

  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(5px); }
  }

  /* ── Vertical side labels (editorial magazine touch) ── */
  .side-label {
    position: absolute;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(184, 148, 74, 0.18);
    writing-mode: vertical-lr;
    z-index: 3;
  }
  .side-label.left {
    left: 28px;
    top: 50%;
    transform: translateY(-50%) rotate(180deg);
  }
  .side-label.right {
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
  }

  /* ── Corner accents ── */
  .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    z-index: 3;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: rgba(184, 148, 74, 0.3);
  }
  .corner.tl { top: 40px; left: 40px; }
  .corner.tl::before { top: 0; left: 0; width: 20px; height: 1px; }
  .corner.tl::after  { top: 0; left: 0; width: 1px; height: 20px; }

  .corner.tr { top: 40px; right: 40px; }
  .corner.tr::before { top: 0; right: 0; width: 20px; height: 1px; }
  .corner.tr::after  { top: 0; right: 0; width: 1px; height: 20px; }

  .corner.bl { bottom: 40px; left: 40px; }
  .corner.bl::before { bottom: 0; left: 0; width: 20px; height: 1px; }
  .corner.bl::after  { bottom: 0; left: 0; width: 1px; height: 20px; }

  .corner.br { bottom: 40px; right: 40px; }
  .corner.br::before { bottom: 0; right: 0; width: 20px; height: 1px; }
  .corner.br::after  { bottom: 0; right: 0; width: 1px; height: 20px; }

  /* ── Decorative diamond ── */
  .diamond {
    width: 8px;
    height: 8px;
    border: 1px solid rgba(184, 148, 74, 0.4);
    transform: rotate(45deg);
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <!-- Texture overlay -->
  <div class="texture"></div>

  <!-- Vertical margin lines -->
  <div class="margin-line left"></div>
  <div class="margin-line right"></div>
  <div class="margin-line-inner left"></div>
  <div class="margin-line-inner right"></div>

  <!-- Corner accents -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Side labels -->
  <div class="side-label left">Luxury Real Estate</div>
  <div class="side-label right">Apex — Exclusive</div>

  <!-- Main canvas -->
  <div class="canvas">

    <!-- Na prodaju label -->
    <div class="label-na-prodaju" id="tipLabel">Na prodaju</div>

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="logo-transparent.png" alt="APEX Real Estate">
    </div>

    <!-- Decorative rule -->
    <div class="top-rule"></div>

    <!-- Headline: Location -->
    <div class="headline-block">
      <div class="headline-rule short"></div>
      <div class="headline-line" id="locationLine1">Centar</div>
      <div class="headline-rule"></div>
      <div class="headline-line accent" id="locationLine2">Novi Sad</div>
      <div class="headline-rule short"></div>
    </div>

    <!-- Subtitle -->
    <div class="subtitle" id="subtitleText">Ekskluzivna nekretnina</div>

    <!-- Details band -->
    <div class="details-band">
      <div class="detail-item">
        <div class="detail-label">Kvadratura</div>
        <div class="detail-value"><span id="sqmValue">126</span><span class="unit">m²</span></div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Sprat</div>
        <div class="detail-value" id="floorValue">3.</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">Sobe</div>
        <div class="detail-value" id="roomsValue">4</div>
      </div>
    </div>

    <!-- Price -->
    <div class="price-block">
      <div class="price-text" id="priceValue">185.000 €</div>
      <div class="price-underline"></div>
    </div>

  </div>

  <!-- Bottom area -->
  <div class="bottom-area">
    <div class="edition-text">MMXXVI · Exclusive</div>
    <div class="swipe-hint">
      <span class="swipe-text">Saznaj više</span>
      <div class="swipe-arrow">
        <span></span>
        <svg viewBox="0 0 8 8"><polyline points="1,1 6,4 1,7"/></svg>
      </div>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════
//  APEX REAL ESTATE — PODACI O NEKRETNINI
//  Izmeni podatke ispod za novu objavu
// ═══════════════════════════════════════════════

const nekretnina = {
    lokacija:    "Centar, Novi Sad",
    kvadratura:  "126",
    sprat:       "3.",
    sobe:        "4",
    cena:        "185.000 €",
    tip:         "Na prodaju"
};

// ═══════════════════════════════════════════════
//  Auto-populate from data
// ═══════════════════════════════════════════════

(function() {
    // Parse location into two lines
    const parts = nekretnina.lokacija.split(',').map(s => s.trim());
    const line1 = parts[0] || '';
    const line2 = parts.slice(1).join(', ') || '';

    document.getElementById('locationLine1').textContent = line1;
    document.getElementById('locationLine2').textContent = line2;
    document.getElementById('sqmValue').textContent      = nekretnina.kvadratura;
    document.getElementById('floorValue').textContent     = nekretnina.sprat;
    document.getElementById('roomsValue').textContent     = nekretnina.sobe;
    document.getElementById('priceValue').textContent     = nekretnina.cena;
    document.getElementById('tipLabel').textContent       = nekretnina.tip;
})();
</script>

</body>
</html>
