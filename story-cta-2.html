<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>APEX Story — Besplatna Procena</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; }

        .story {
            width: 1080px; height: 1920px; position: relative;
            background: #0a0a0a; display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        /* Diagonal gold sweep */
        .sweep {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .sweep::before {
            content: ''; position: absolute;
            top: 35%; left: -20%; width: 140%; height: 350px;
            background: linear-gradient(135deg, transparent 0%, rgba(184,148,74,0.06) 30%, rgba(184,148,74,0.1) 50%, rgba(184,148,74,0.06) 70%, transparent 100%);
            transform: rotate(-8deg);
        }
        .sweep::after {
            content: ''; position: absolute;
            top: 38%; left: -20%; width: 140%; height: 200px;
            background: linear-gradient(135deg, transparent 0%, rgba(184,148,74,0.03) 30%, rgba(184,148,74,0.06) 50%, rgba(184,148,74,0.03) 70%, transparent 100%);
            transform: rotate(-12deg);
        }

        /* Gold frame */
        .frame { position: absolute; top: 25px; left: 25px; right: 25px; bottom: 25px; border: 1px solid rgba(184,148,74,0.15); pointer-events: none; }
        .frame::before { content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px; border: 1px solid rgba(184,148,74,0.07); }

        /* Corner ornaments */
        .ornament { position: absolute; width: 40px; height: 40px; }
        .ornament::before, .ornament::after { content: ''; position: absolute; background: #B8944A; }
        .ornament.tl { top: 20px; left: 20px; }
        .ornament.tl::before { top: 0; left: 0; width: 20px; height: 1.5px; }
        .ornament.tl::after { top: 0; left: 0; width: 1.5px; height: 20px; }
        .ornament.tr { top: 20px; right: 20px; }
        .ornament.tr::before { top: 0; right: 0; width: 20px; height: 1.5px; }
        .ornament.tr::after { top: 0; right: 0; width: 1.5px; height: 20px; }
        .ornament.bl { bottom: 20px; left: 20px; }
        .ornament.bl::before { bottom: 0; left: 0; width: 20px; height: 1.5px; }
        .ornament.bl::after { bottom: 0; left: 0; width: 1.5px; height: 20px; }
        .ornament.br { bottom: 20px; right: 20px; }
        .ornament.br::before { bottom: 0; right: 0; width: 20px; height: 1.5px; }
        .ornament.br::after { bottom: 0; right: 0; width: 1.5px; height: 20px; }

        .logo { margin-top: 130px; }
        .logo img { width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 4px 30px rgba(184,148,74,0.2)); }

        .label {
            margin-top: 70px;
            font-weight: 500; font-size: 15px; letter-spacing: 6px; text-transform: uppercase;
            color: #B8944A; display: flex; align-items: center; gap: 20px;
        }
        .label::before, .label::after { content: ''; width: 40px; height: 1px; background: rgba(184,148,74,0.4); }

        .headline {
            margin-top: 40px; text-align: center; padding: 0 90px;
            font-family: 'Playfair Display', serif; font-size: 68px; font-weight: 600;
            color: #fff; line-height: 1.2;
        }
        .headline em { font-style: italic; color: #d4af5a; }

        /* Benefits */
        .benefits { margin-top: 80px; display: flex; flex-direction: column; gap: 28px; padding: 0 110px; width: 100%; }
        .benefit {
            display: flex; align-items: center; gap: 22px;
            padding: 24px 30px; border-radius: 14px;
            background: rgba(184,148,74,0.04); border: 1px solid rgba(184,148,74,0.1);
        }
        .benefit-check {
            width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, rgba(184,148,74,0.15), rgba(184,148,74,0.05));
            border: 1px solid rgba(184,148,74,0.3);
            display: flex; align-items: center; justify-content: center;
        }
        .benefit-check svg { width: 18px; height: 18px; stroke: #d4af5a; stroke-width: 2.5; fill: none; }
        .benefit-text { font-weight: 400; font-size: 22px; color: rgba(255,255,255,0.7); }

        /* CTA */
        .cta-area { margin-top: auto; margin-bottom: 180px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .cta-box {
            padding: 28px 80px; border: 2px solid #B8944A; border-radius: 12px;
            font-weight: 600; font-size: 20px; letter-spacing: 4px; text-transform: uppercase;
            color: #B8944A; display: flex; align-items: center; gap: 14px;
            background: rgba(184,148,74,0.05);
            box-shadow: 0 0 40px rgba(184,148,74,0.1), inset 0 0 40px rgba(184,148,74,0.03);
        }
        .cta-box svg { width: 20px; height: 20px; stroke: #B8944A; stroke-width: 2; fill: none; }
        .cta-contact { font-weight: 300; font-size: 16px; color: rgba(255,255,255,0.3); letter-spacing: 1px; }

        .noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); pointer-events: none; }
    </style>
</head>
<body>
<div class="story">
    <div class="noise"></div>
    <div class="sweep"></div>
    <div class="frame"></div>
    <div class="ornament tl"></div><div class="ornament tr"></div><div class="ornament bl"></div><div class="ornament br"></div>

    <div class="logo"><img src="logo-transparent.png" alt="APEX"></div>

    <div class="label">Ekskluzivna ponuda</div>

    <div class="headline">Besplatna procena <em>Vaše</em> nekretnine</div>

    <div class="benefits">
        <div class="benefit">
            <div class="benefit-check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
            <span class="benefit-text">Procena u roku 24h</span>
        </div>
        <div class="benefit">
            <div class="benefit-check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
            <span class="benefit-text">Bez ikakvih obaveza</span>
        </div>
        <div class="benefit">
            <div class="benefit-check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
            <span class="benefit-text">Stručni tim agenata</span>
        </div>
    </div>

    <div class="cta-area">
        <div class="cta-box">
            Zakažite procenu
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <div class="cta-contact">Pošaljite nam poruku →</div>
    </div>
</div>
</body>
</html>
