<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX - Kupovina Kreativa - Render Stana</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        /* ===================== */
        /* 1080x1080 SQUARE AD   */
        /* ===================== */
        .creative-container {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Background apartment render */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65) saturate(1.1);
        }

        /* Cinematic gradient overlay - dark edges, lighter center on the apartment */
        .overlay-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse 80% 70% at 50% 40%,
                rgba(0, 0, 0, 0.0) 0%,
                rgba(0, 0, 0, 0.15) 40%,
                rgba(0, 0, 0, 0.5) 70%,
                rgba(0, 0, 0, 0.85) 100%
            );
            z-index: 2;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.95) 0%,
                rgba(0, 0, 0, 0.8) 30%,
                rgba(0, 0, 0, 0.0) 100%
            );
            z-index: 3;
        }

        .overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.7) 0%,
                rgba(0, 0, 0, 0.0) 100%
            );
            z-index: 3;
        }

        /* Top "badge" label */
        .top-badge {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 10;
            background: linear-gradient(135deg, #c9a84c, #d4b45a);
            color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-badge .dot {
            width: 8px;
            height: 8px;
            background: #0a0a0a;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.7); }
        }

        /* Top logo */
        .top-logo {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 10;
        }

        .top-logo-text {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 8px;
            color: #ffffff;
        }

        .top-logo-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 6px;
            color: #c9a84c;
            margin-top: -2px;
        }

        /* Main content area */
        .text-content {
            position: absolute;
            bottom: 130px;
            left: 0;
            width: 100%;
            z-index: 10;
            text-align: center;
            padding: 0 55px;
        }

        /* "Vaš novi dom" tag */
        .pre-heading {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 28px;
            color: #d4b45a;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.7);
        }

        .main-heading {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 76px;
            line-height: 1.0;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 
                0 2px 25px rgba(0, 0, 0, 0.7),
                0 4px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 8px;
        }

        .main-heading .highlight {
            color: #d4b45a;
        }

        .sub-heading {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-size: 30px;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            margin-bottom: 35px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Feature pills */
        .feature-pills {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            background: rgba(201, 168, 76, 0.12);
            border: 1px solid rgba(201, 168, 76, 0.3);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.5px;
        }

        .pill .icon {
            color: #d4b45a;
            font-size: 16px;
        }

        /* CTA Button */
        .cta-wrapper {
            text-align: center;
        }

        .cta-button {
            display: inline-block;
            padding: 24px 70px;
            background: linear-gradient(
                135deg,
                #c9a84c 0%,
                #d4b45a 40%,
                #e6c96e 60%,
                #d4b45a 100%
            );
            color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 35px rgba(201, 168, 76, 0.35);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.6s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-sub {
            display: block;
            margin-top: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1px;
        }

        /* Bottom bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(8, 8, 8, 0.97);
            border-top: 2px solid;
            border-image: linear-gradient(
                90deg,
                transparent 0%,
                #c9a84c 20%,
                #d4b45a 50%,
                #c9a84c 80%,
                transparent 100%
            ) 1;
        }

        .bottom-info {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .bottom-logo {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 6px;
            color: #ffffff;
        }

        .bottom-divider {
            width: 1.5px;
            height: 28px;
            background: linear-gradient(180deg, #c9a84c, #8a7030);
        }

        .bottom-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 19px;
            color: rgba(255, 255, 255, 0.65);
        }

        /* Corner design elements */
        .corner-frame {
            position: absolute;
            z-index: 5;
        }

        .corner-frame.tl {
            top: 25px;
            left: 25px;
            width: 80px;
            height: 80px;
            border-top: 2px solid rgba(201, 168, 76, 0.35);
            border-left: 2px solid rgba(201, 168, 76, 0.35);
        }

        .corner-frame.br {
            bottom: 95px;
            right: 25px;
            width: 80px;
            height: 80px;
            border-bottom: 2px solid rgba(201, 168, 76, 0.35);
            border-right: 2px solid rgba(201, 168, 76, 0.35);
        }

        /* Variant Controls */
        .variant-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.92);
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            color: white;
            font-size: 14px;
            max-width: 340px;
            border: 1px solid rgba(201, 168, 76, 0.2);
        }

        .variant-controls h3 {
            margin-bottom: 15px;
            color: #d4a843;
            font-size: 16px;
        }

        .variant-btn {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 5px 0;
            background: rgba(212, 168, 67, 0.1);
            border: 1px solid rgba(212, 168, 67, 0.25);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }

        .variant-btn:hover, .variant-btn.active {
            background: rgba(212, 168, 67, 0.3);
            border-color: #d4a843;
        }

        .variant-btn.active {
            box-shadow: 0 0 10px rgba(212, 168, 67, 0.3);
        }

        .hide-controls {
            display: block;
            margin-top: 12px;
            padding: 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 12px;
        }

        @media print {
            .variant-controls { display: none; }
            body { padding: 0; background: white; }
        }
    </style>
</head>
<body>

    <!-- Variant Controls -->
    <div class="variant-controls" id="controls">
        <h3>⚡ Varijante teksta</h3>
        <button class="variant-btn active" onclick="setVariant(1)">
            1. TRAŽITE STAN U NOVOM SADU? → Popunite formu (render stana)
        </button>
        <button class="variant-btn" onclick="setVariant(2)">
            2. PRONAŠLI SMO VAŠ NOVI DOM → Prijavite se
        </button>
        <button class="variant-btn" onclick="setVariant(3)">
            3. NOVI STAN VAS ČEKA → Ostavite podatke
        </button>
        <button class="hide-controls" onclick="toggleControls()">Sakrij/Prikaži kontrole</button>
    </div>

    <!-- Main Creative 1080x1080 -->
    <div class="creative-container" id="creative">
        <!-- Background Apartment Render -->
        <img class="bg-image" src="luxury_apartment_bg.png" alt="Luxury apartment render">
        
        <!-- Overlays -->
        <div class="overlay-vignette"></div>
        <div class="overlay-top"></div>
        <div class="overlay-bottom"></div>

        <!-- Corner frames -->
        <div class="corner-frame tl"></div>
        <div class="corner-frame br"></div>

        <!-- Top Logo -->
        <div class="top-logo">
            <div class="top-logo-text">APEX</div>
            <div class="top-logo-sub">REAL ESTATE</div>
        </div>

        <!-- Badge -->
        <div class="top-badge" id="badge">
            <span class="dot"></span>
            NOVI STANOVI
        </div>

        <!-- Main Text Content -->
        <div class="text-content">
            <div class="pre-heading" id="preText">Vaš novi dom čeka</div>
            <div class="main-heading" id="mainText">
                TRAŽITE STAN<br>
                <span class="highlight">U NOVOM SADU?</span>
            </div>
            <div class="sub-heading" id="subText">
                Popunite formu — mi ćemo se pobrinuti za ostalo
            </div>

            <!-- Feature pills -->
            <div class="feature-pills" id="pills">
                <div class="pill"><span class="icon">✓</span> Pravna pomoć</div>
                <div class="pill"><span class="icon">✓</span> Konsultacije</div>
                <div class="pill"><span class="icon">✓</span> Pregovaranje</div>
            </div>

            <div class="cta-wrapper">
                <div class="cta-button" id="ctaText">POPUNITE FORMU →</div>
                <span class="cta-sub" id="ctaSub">100% besplatno • Bez obaveza</span>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="bottom-info">
                <div class="bottom-logo">APEX</div>
                <div class="bottom-divider"></div>
                <div class="bottom-tagline" id="taglineText">Od ideje do ključa — sve na jednom mestu</div>
            </div>
        </div>
    </div>

    <script>
        const variants = {
            1: {
                pre: 'Vaš novi dom čeka',
                main: 'TRAŽITE STAN<br><span class="highlight">U NOVOM SADU?</span>',
                sub: 'Popunite formu — mi ćemo se pobrinuti za ostalo',
                badge: '<span class="dot"></span> NOVI STANOVI',
                pills: [
                    { icon: '✓', text: 'Pravna pomoć' },
                    { icon: '✓', text: 'Konsultacije' },
                    { icon: '✓', text: 'Pregovaranje' }
                ],
                cta: 'POPUNITE FORMU →',
                ctaSub: '100% besplatno • Bez obaveza',
                tagline: 'Od ideje do ključa — sve na jednom mestu'
            },
            2: {
                pre: 'Pronašli smo ga',
                main: 'VAŠ NOVI<br><span class="highlight">DOM U NOVOM SADU</span>',
                sub: 'Stručna podrška od prvog razgledanja do potpisivanja ugovora',
                badge: '<span class="dot"></span> AKTUELNA PONUDA',
                pills: [
                    { icon: '🏠', text: 'Novogradnja' },
                    { icon: '🔑', text: 'Useljivo' },
                    { icon: '📋', text: 'Sva dokumenta' }
                ],
                cta: 'PRIJAVITE SE →',
                ctaSub: 'Popunite formu • Javimo se odmah',
                tagline: 'Vaša nekretnina, naš prioritet'
            },
            3: {
                pre: 'Ne čekajte — delujte',
                main: 'NOVI STAN<br><span class="highlight">VAS ČEKA</span>',
                sub: 'Ekskluzivne ponude stanova u najtraženijim delovima Novog Sada',
                badge: '<span class="dot"></span> EKSKLUZIVNO',
                pills: [
                    { icon: '⭐', text: 'Premium lokacije' },
                    { icon: '💰', text: 'Fer cene' },
                    { icon: '🤝', text: 'Podrška 24/7' }
                ],
                cta: 'OSTAVITE PODATKE →',
                ctaSub: 'Kontaktiramo Vas u roku od 1h',
                tagline: 'Brzo, sigurno, efikasno — Apex Real Estate'
            }
        };

        function setVariant(num) {
            const v = variants[num];
            document.getElementById('preText').textContent = v.pre;
            document.getElementById('mainText').innerHTML = v.main;
            document.getElementById('subText').textContent = v.sub;
            document.getElementById('badge').innerHTML = v.badge;
            document.getElementById('ctaText').textContent = v.cta;
            document.getElementById('ctaSub').textContent = v.ctaSub;
            document.getElementById('taglineText').textContent = v.tagline;
            
            // Update pills
            const pillsContainer = document.getElementById('pills');
            pillsContainer.innerHTML = v.pills.map(p => 
                `<div class="pill"><span class="icon">${p.icon}</span> ${p.text}</div>`
            ).join('');
            
            document.querySelectorAll('.variant-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === num - 1);
            });
        }

        function toggleControls() {
            const controls = document.getElementById('controls');
            const btns = controls.querySelectorAll('.variant-btn, h3');
            btns.forEach(el => {
                el.style.display = el.style.display === 'none' ? '' : 'none';
            });
        }
    </script>

</body>
</html>
