<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX - Prodaja Kreativa - Panorama Novi Sad</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        /* ===================== */
        /* 1080x1080 SQUARE AD   */
        /* ===================== */
        .creative-container {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Background panorama */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.75) saturate(1.15);
        }

        /* Gradient overlays */
        .overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.6) 0%,
                rgba(0, 0, 0, 0.0) 100%
            );
            z-index: 2;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.92) 0%,
                rgba(0, 0, 0, 0.75) 35%,
                rgba(0, 0, 0, 0.0) 100%
            );
            z-index: 2;
        }

        /* Decorative gold line */
        .gold-accent-line {
            position: absolute;
            top: 50%;
            left: 60px;
            right: 60px;
            height: 2px;
            background: linear-gradient(
                90deg,
                rgba(201, 168, 76, 0) 0%,
                rgba(201, 168, 76, 0.8) 20%,
                rgba(212, 180, 90, 1) 50%,
                rgba(201, 168, 76, 0.8) 80%,
                rgba(201, 168, 76, 0) 100%
            );
            z-index: 5;
        }

        /* Top logo area */
        .top-logo {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .top-logo-text {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 28px;
            letter-spacing: 8px;
            color: #ffffff;
        }

        .top-logo-sub {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 6px;
            color: #c9a84c;
            margin-top: -2px;
        }

        /* Main text block - centered-bottom */
        .text-content {
            position: absolute;
            bottom: 140px;
            left: 0;
            width: 100%;
            z-index: 10;
            text-align: center;
            padding: 0 60px;
        }

        .main-heading {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 72px;
            line-height: 1.05;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 
                0 2px 20px rgba(0, 0, 0, 0.6),
                0 4px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        .main-heading .city-name {
            color: #d4b45a;
            display: block;
        }

        .sub-heading {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-style: italic;
            font-size: 36px;
            line-height: 1.3;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 
                0 2px 15px rgba(0, 0, 0, 0.7);
            margin-bottom: 40px;
        }

        /* CTA Button */
        .cta-button {
            display: inline-block;
            padding: 22px 60px;
            background: linear-gradient(
                135deg,
                #c9a84c 0%,
                #d4b45a 40%,
                #e6c96e 60%,
                #d4b45a 100%
            );
            color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.25),
                transparent
            );
            transition: left 0.6s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-sub {
            display: block;
            margin-top: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        /* Bottom bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: rgba(10, 10, 10, 0.95);
            border-top: 2px solid;
            border-image: linear-gradient(
                90deg,
                transparent 0%,
                #c9a84c 20%,
                #d4b45a 50%,
                #c9a84c 80%,
                transparent 100%
            ) 1;
        }

        .bottom-info {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .bottom-logo {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 6px;
            color: #ffffff;
        }

        .bottom-divider {
            width: 1.5px;
            height: 30px;
            background: linear-gradient(180deg, #c9a84c, #8a7030);
        }

        .bottom-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Corner accents */
        .corner-accent {
            position: absolute;
            z-index: 5;
            width: 60px;
            height: 60px;
        }

        .corner-accent.top-right {
            top: 30px;
            right: 30px;
            border-top: 2px solid rgba(201, 168, 76, 0.4);
            border-right: 2px solid rgba(201, 168, 76, 0.4);
        }

        .corner-accent.bottom-left {
            bottom: 100px;
            left: 30px;
            border-bottom: 2px solid rgba(201, 168, 76, 0.4);
            border-left: 2px solid rgba(201, 168, 76, 0.4);
        }

        /* Variant Controls */
        .variant-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.92);
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            color: white;
            font-size: 14px;
            max-width: 320px;
            border: 1px solid rgba(201, 168, 76, 0.2);
        }

        .variant-controls h3 {
            margin-bottom: 15px;
            color: #d4a843;
            font-size: 16px;
        }

        .variant-btn {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 5px 0;
            background: rgba(212, 168, 67, 0.1);
            border: 1px solid rgba(212, 168, 67, 0.25);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }

        .variant-btn:hover, .variant-btn.active {
            background: rgba(212, 168, 67, 0.3);
            border-color: #d4a843;
        }

        .variant-btn.active {
            box-shadow: 0 0 10px rgba(212, 168, 67, 0.3);
        }

        .hide-controls {
            display: block;
            margin-top: 12px;
            padding: 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 12px;
        }

        @media print {
            .variant-controls { display: none; }
            body { padding: 0; background: white; }
        }
    </style>
</head>
<body>

    <!-- Variant Controls -->
    <div class="variant-controls" id="controls">
        <h3>⚡ Varijante teksta</h3>
        <button class="variant-btn active" onclick="setVariant(1)">
            1. PRODAJETE STAN U NOVOM SADU? → Popunite formu
        </button>
        <button class="variant-btn" onclick="setVariant(2)">
            2. VAŠ STAN — NAŠA MISIJA → Saznajte vrednost
        </button>
        <button class="variant-btn" onclick="setVariant(3)">
            3. PRODAJA NEKRETNINE? → Besplatna procena
        </button>
        <button class="hide-controls" onclick="toggleControls()">Sakrij/Prikaži kontrole</button>
    </div>

    <!-- Main Creative 1080x1080 -->
    <div class="creative-container" id="creative">
        <!-- Background Panorama Image -->
        <img class="bg-image" src="novisad_panorama_bg.png" alt="Novi Sad panorama">
        
        <!-- Overlays -->
        <div class="overlay-top"></div>
        <div class="overlay-bottom"></div>

        <!-- Gold accent line -->
        <div class="gold-accent-line"></div>

        <!-- Corner accents -->
        <div class="corner-accent top-right"></div>
        <div class="corner-accent bottom-left"></div>

        <!-- Top Logo -->
        <div class="top-logo">
            <div>
                <div class="top-logo-text">APEX</div>
                <div class="top-logo-sub">REAL ESTATE</div>
            </div>
        </div>

        <!-- Main Text Content -->
        <div class="text-content">
            <div class="main-heading" id="mainText">
                PRODAJETE STAN
                <span class="city-name" id="cityText">U NOVOM SADU?</span>
            </div>
            <div class="sub-heading" id="subText">
                Mi pronalazimo pravog kupca za Vašu nekretninu
            </div>
            <div class="cta-button" id="ctaText">POPUNITE FORMU →</div>
            <span class="cta-sub" id="ctaSub">Besplatna konsultacija • Bez obaveza</span>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="bottom-info">
                <div class="bottom-logo">APEX</div>
                <div class="bottom-divider"></div>
                <div class="bottom-tagline" id="taglineText">Od oglasa do prodaje — sve na jednom mestu</div>
            </div>
        </div>
    </div>

    <script>
        const variants = {
            1: {
                main: 'PRODAJETE STAN',
                city: 'U NOVOM SADU?',
                sub: 'Mi pronalazimo pravog kupca za Vašu nekretninu',
                cta: 'POPUNITE FORMU →',
                ctaSub: 'Besplatna konsultacija • Bez obaveza',
                tagline: 'Od oglasa do prodaje — sve na jednom mestu'
            },
            2: {
                main: 'VAŠ STAN',
                city: '— NAŠA MISIJA',
                sub: 'Profesionalna prodaja nekretnina u Novom Sadu',
                cta: 'SAZNAJTE VREDNOST →',
                ctaSub: 'Besplatna procena u roku od 24h',
                tagline: 'Vaša nekretnina, naš prioritet'
            },
            3: {
                main: 'PRODAJA',
                city: 'NEKRETNINE?',
                sub: 'Brzo, sigurno i po najboljoj ceni na tržištu',
                cta: 'BESPLATNA PROCENA →',
                ctaSub: 'Popunite formu • Javimo se u roku od 1h',
                tagline: 'Brzo, sigurno, efikasno — Apex Real Estate'
            }
        };

        function setVariant(num) {
            const v = variants[num];
            document.getElementById('mainText').innerHTML = v.main + '<span class="city-name" id="cityText">' + v.city + '</span>';
            document.getElementById('subText').textContent = v.sub;
            document.getElementById('ctaText').textContent = v.cta;
            document.getElementById('ctaSub').textContent = v.ctaSub;
            document.getElementById('taglineText').textContent = v.tagline;
            
            document.querySelectorAll('.variant-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === num - 1);
            });
        }

        function toggleControls() {
            const controls = document.getElementById('controls');
            const btns = controls.querySelectorAll('.variant-btn, h3');
            btns.forEach(el => {
                el.style.display = el.style.display === 'none' ? '' : 'none';
            });
        }
    </script>

</body>
</html>
