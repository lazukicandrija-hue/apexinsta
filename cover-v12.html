<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX Real Estate — Cover V12 (4:5 Instagram)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #080808;
    font-family: 'Space Grotesk', sans-serif;
    position: relative;
  }

  .canvas {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: #080808;
  }

  /* ── Subtle grid texture ── */
  .canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(184,148,74,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(184,148,74,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
  }

  /* ── Noise overlay ── */
  .canvas::after {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px;
    z-index: 1;
    pointer-events: none;
  }

  /* ── Logo — top-left, smaller ── */
  .logo {
    position: absolute;
    top: 58px;
    left: 52px;
    z-index: 10;
  }
  .logo img {
    width: 180px;
    height: auto;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
  }

  /* ── "Na prodaju" rotated badge ── */
  .badge {
    position: absolute;
    top: 72px;
    right: 44px;
    z-index: 10;
    background: #B8944A;
    color: #080808;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px 28px;
    transform: rotate(-3deg);
    box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
  }

  /* ── Thick gold horizontal bar ── */
  .gold-bar {
    position: absolute;
    top: 260px;
    left: 0;
    width: 720px;
    height: 8px;
    background: #B8944A;
    z-index: 5;
  }

  /* ── Location — thin/light above price ── */
  .location {
    position: absolute;
    top: 295px;
    left: 52px;
    z-index: 10;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 32px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 6px;
    text-transform: uppercase;
  }

  /* ── PRICE — the HERO ── */
  .price-block {
    position: absolute;
    top: 345px;
    left: 42px;
    z-index: 10;
    line-height: 1;
  }
  .price-value {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 168px;
    color: #ffffff;
    letter-spacing: -6px;
    display: block;
    text-shadow: 0 4px 30px rgba(0,0,0,0.6);
  }
  .price-currency {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 72px;
    color: #B8944A;
    letter-spacing: 2px;
    margin-top: -8px;
    display: block;
  }

  /* ── Dramatic oversized ghost text — cut off ── */
  .ghost-text {
    position: absolute;
    top: 560px;
    left: -30px;
    z-index: 2;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 320px;
    color: rgba(184,148,74,0.04);
    letter-spacing: -12px;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }

  /* ── Property details — right edge, monospace, stacked ── */
  .details {
    position: absolute;
    right: 52px;
    top: 700px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 32px;
    text-align: left;
  }
  .detail-item {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .detail-bullet {
    width: 24px;
    height: 3px;
    background: #B8944A;
    flex-shrink: 0;
  }
  .detail-label {
    font-family: 'Space Mono', monospace;
    font-weight: 400;
    font-size: 15px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 3px;
    text-transform: uppercase;
    min-width: 100px;
  }
  .detail-value {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 28px;
    color: #ffffff;
    letter-spacing: 1px;
  }

  /* ── Second gold bar — bottom accent ── */
  .gold-bar-bottom {
    position: absolute;
    bottom: 260px;
    right: 0;
    width: 500px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #B8944A);
    z-index: 5;
  }

  /* ── Vertical text — left edge ── */
  .vertical-text {
    position: absolute;
    left: 16px;
    bottom: 360px;
    z-index: 10;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: 'Space Mono', monospace;
    font-weight: 400;
    font-size: 11px;
    color: rgba(184,148,74,0.25);
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  /* ── Decorative corner brackets ── */
  .corner-tl, .corner-br {
    position: absolute;
    z-index: 5;
  }
  .corner-tl {
    top: 38px;
    left: 38px;
    width: 30px;
    height: 30px;
    border-top: 2px solid rgba(184,148,74,0.15);
    border-left: 2px solid rgba(184,148,74,0.15);
  }
  .corner-br {
    bottom: 38px;
    right: 38px;
    width: 30px;
    height: 30px;
    border-bottom: 2px solid rgba(184,148,74,0.15);
    border-right: 2px solid rgba(184,148,74,0.15);
  }

  /* ── Bottom section ── */
  .bottom-section {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 160px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
  }

  /* ── Swipe hint ── */
  .swipe-hint {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0.3;
  }
  .swipe-hint span {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 400;
    font-size: 13px;
    color: #ffffff;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  .swipe-arrow {
    display: flex;
    gap: 3px;
    animation: swipeMove 1.8s ease-in-out infinite;
  }
  .swipe-arrow i {
    display: block;
    width: 8px;
    height: 8px;
    border-right: 1.5px solid rgba(255,255,255,0.6);
    border-bottom: 1.5px solid rgba(255,255,255,0.6);
    transform: rotate(-45deg);
  }

  @keyframes swipeMove {
    0%, 100% { transform: translateX(0); opacity: 0.4; }
    50% { transform: translateX(6px); opacity: 1; }
  }

  /* ── Large index number — decorative ── */
  .index-number {
    position: absolute;
    bottom: 220px;
    left: 52px;
    z-index: 4;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 160px;
    color: rgba(184,148,74,0.06);
    line-height: 1;
    letter-spacing: -8px;
  }

  /* ── Dot grid decoration ── */
  .dot-grid {
    position: absolute;
    top: 180px;
    right: 50px;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .dot-grid span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(184,148,74,0.15);
  }

  /* ── Kvadratura big display — overlapping ── */
  .kvad-big {
    position: absolute;
    left: 52px;
    bottom: 340px;
    z-index: 10;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .kvad-big .num {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 88px;
    color: #ffffff;
    letter-spacing: -3px;
  }
  .kvad-big .unit {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 36px;
    color: #B8944A;
    letter-spacing: 2px;
  }
  .kvad-big .label {
    font-family: 'Space Mono', monospace;
    font-weight: 400;
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 4px;
    text-transform: uppercase;
    position: absolute;
    bottom: -20px;
    left: 0;
  }

  /* ── Vertical divider line ── */
  .v-divider {
    position: absolute;
    right: 280px;
    top: 660px;
    height: 380px;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(184,148,74,0.2), transparent);
    z-index: 4;
  }

</style>
</head>
<body>
<div class="canvas">

  <!-- Corner brackets -->
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <!-- Logo -->
  <div class="logo">
    <img src="logo-transparent.png" alt="APEX Real Estate">
  </div>

  <!-- Na prodaju badge — rotated -->
  <div class="badge" id="badge">NA PRODAJU</div>

  <!-- Dot grid decoration -->
  <div class="dot-grid">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <!-- Gold horizontal bar -->
  <div class="gold-bar"></div>

  <!-- Location — thin/light -->
  <div class="location" id="location">CENTAR, NOVI SAD</div>

  <!-- PRICE — HERO ELEMENT -->
  <div class="price-block">
    <span class="price-value" id="priceValue">185.000</span>
    <span class="price-currency">EUR</span>
  </div>

  <!-- Ghost text — cut off dramatically -->
  <div class="ghost-text">APEX</div>

  <!-- Vertical text — left edge -->
  <div class="vertical-text">APEX REAL ESTATE</div>

  <!-- Large index number -->
  <div class="index-number">09</div>

  <!-- Vertical divider -->
  <div class="v-divider"></div>

  <!-- Kvadratura big display -->
  <div class="kvad-big">
    <span class="num" id="kvadBig">126</span>
    <span class="unit">m²</span>
    <span class="label">POVRŠINA</span>
  </div>

  <!-- Property details — right edge, stacked -->
  <div class="details">
    <div class="detail-item">
      <div class="detail-bullet"></div>
      <div>
        <div class="detail-label">SPRAT</div>
        <div class="detail-value" id="detailSprat">3.</div>
      </div>
    </div>
    <div class="detail-item">
      <div class="detail-bullet"></div>
      <div>
        <div class="detail-label">SOBE</div>
        <div class="detail-value" id="detailSobe">4</div>
      </div>
    </div>
    <div class="detail-item">
      <div class="detail-bullet"></div>
      <div>
        <div class="detail-label">M²</div>
        <div class="detail-value" id="detailKvad">126</div>
      </div>
    </div>
  </div>

  <!-- Second gold bar -->
  <div class="gold-bar-bottom"></div>

  <!-- Bottom swipe hint -->
  <div class="bottom-section">
    <div class="swipe-hint">
      <span>Prevuci za više</span>
      <div class="swipe-arrow">
        <i></i><i></i><i></i>
      </div>
    </div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════
//  IZMENI PODATKE O NEKRETNINI OVDE:
// ═══════════════════════════════════════════════
const nekretnina = {
    lokacija:    "Centar, Novi Sad",
    kvadratura:  "126",
    sprat:       "3.",
    sobe:        "4",
    cena:        "185.000 €",
    tip:         "Na prodaju"
};
// ═══════════════════════════════════════════════

function renderData() {
    // Parse price — extract number and currency
    const priceRaw = nekretnina.cena;
    const priceNum = priceRaw.replace(/[^0-9.]/g, '').replace(/\.(?=\d{3})/g, '.');
    const priceParts = priceRaw.match(/[\d.]+/);
    const priceDisplay = priceParts ? priceParts[0] : priceRaw;

    document.getElementById('priceValue').textContent = priceDisplay;
    document.getElementById('location').textContent = nekretnina.lokacija.toUpperCase();
    document.getElementById('badge').textContent = nekretnina.tip.toUpperCase();
    document.getElementById('kvadBig').textContent = nekretnina.kvadratura;
    document.getElementById('detailSprat').textContent = nekretnina.sprat;
    document.getElementById('detailSobe').textContent = nekretnina.sobe;
    document.getElementById('detailKvad').textContent = nekretnina.kvadratura;
}

renderData();
</script>
</body>
</html>
