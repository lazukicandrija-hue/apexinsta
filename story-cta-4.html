<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>APEX Story — Prodajete Stan?</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Outfit', sans-serif; }

        .story {
            width: 1080px; height: 1920px; position: relative;
            background: #0a0a0a; display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        /* Triangle echo */
        .tri-bg {
            position: absolute; top: 200px; left: 50%; transform: translateX(-50%);
            width: 900px; height: 900px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            background: linear-gradient(180deg, rgba(184,148,74,0.06) 0%, rgba(184,148,74,0.01) 100%);
        }
        .tri-bg-stroke {
            position: absolute; top: 210px; left: 50%; transform: translateX(-50%);
            width: 880px; height: 880px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: 1px solid rgba(184,148,74,0.05);
        }

        /* Ambient */
        .glow { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(184,148,74,0.06) 0%, transparent 70%); }

        .logo { margin-top: 120px; z-index: 2; }
        .logo img { width: 220px; height: 220px; object-fit: contain; filter: drop-shadow(0 4px 40px rgba(184,148,74,0.2)); }

        /* Question */
        .question {
            margin-top: 80px; text-align: center; z-index: 2; padding: 0 80px;
        }
        .question-small {
            font-weight: 500; font-size: 26px; letter-spacing: 5px; text-transform: uppercase;
            color: #B8944A; margin-bottom: 20px;
        }
        .question-big {
            font-weight: 800; font-size: 78px; color: #fff; line-height: 1.1;
        }
        .question-big .gold-dot { color: #d4af5a; }

        /* Stats social proof */
        .stats {
            margin-top: 80px; z-index: 2;
            display: flex; gap: 50px; align-items: center;
        }
        .stat { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .stat-num {
            font-weight: 800; font-size: 48px;
            background: linear-gradient(135deg, #d4af5a, #B8944A);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .stat-label { font-weight: 300; font-size: 15px; color: rgba(255,255,255,0.4); letter-spacing: 1px; margin-top: 4px; }
        .stat-sep { width: 1px; height: 50px; background: rgba(184,148,74,0.2); }

        /* Gold divider */
        .gold-div { width: 250px; height: 2px; background: linear-gradient(90deg, transparent, #B8944A, transparent); margin: 60px 0; z-index: 2; }

        /* CTA */
        .cta-area { z-index: 2; margin-top: auto; margin-bottom: 160px; display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 0 80px; width: 100%; }
        .cta-btn {
            width: 100%; max-width: 700px; padding: 30px 60px;
            border: 2px solid #B8944A; border-radius: 16px;
            display: flex; align-items: center; justify-content: center; gap: 16px;
            font-weight: 700; font-size: 22px; letter-spacing: 4px; text-transform: uppercase;
            color: #B8944A;
            background: rgba(184,148,74,0.05);
            box-shadow: 0 0 50px rgba(184,148,74,0.08);
        }
        .cta-btn svg { width: 22px; height: 22px; stroke: #B8944A; stroke-width: 2.5; fill: none; }

        /* Contact row */
        .contact-row {
            display: flex; align-items: center; gap: 40px;
        }
        .contact-item {
            display: flex; align-items: center; gap: 10px;
            font-weight: 300; font-size: 18px; color: rgba(255,255,255,0.35);
        }
        .contact-item svg { width: 18px; height: 18px; stroke: rgba(184,148,74,0.5); stroke-width: 2; fill: none; }

        .bottom-text {
            position: absolute; bottom: 60px;
            font-weight: 300; font-size: 14px; font-style: italic;
            color: rgba(184,148,74,0.25); letter-spacing: 2px;
        }

        .noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); pointer-events: none; }
    </style>
</head>
<body>
<div class="story">
    <div class="noise"></div>
    <div class="tri-bg"></div>
    <div class="tri-bg-stroke"></div>
    <div class="glow"></div>

    <div class="logo"><img src="logo-transparent.png" alt="APEX"></div>

    <div class="question">
        <div class="question-small">Prodajete nekretninu?</div>
        <div class="question-big">Mi imamo kupca<span class="gold-dot">.</span></div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-num">50+</div>
            <div class="stat-label">Prodatih</div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat">
            <div class="stat-num">98%</div>
            <div class="stat-label">Zadovoljnih</div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat">
            <div class="stat-num">15</div>
            <div class="stat-label">Dana prosek</div>
        </div>
    </div>

    <div class="gold-div"></div>

    <div class="cta-area">
        <div class="cta-btn">
            Kontaktirajte nas
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <div class="contact-row">
            <div class="contact-item">
                <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.362 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
                060 123 4567
            </div>
            <div class="contact-item">
                <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
                DM →
            </div>
        </div>
    </div>

    <div class="bottom-text">Vaša nekretnina zaslužuje najbolje</div>
</div>
</body>
</html>
