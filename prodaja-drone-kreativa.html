<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Real Estate - Prodaja Kreativa</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .creative-container {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        /* Background drone image */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Gradient overlays for text readability */
        .overlay-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.15) 0%,
                rgba(0, 0, 0, 0.0) 100%
            );
            z-index: 2;
        }

        .overlay-center {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(
                180deg,
                rgba(0, 0, 0, 0.0) 0%,
                rgba(0, 0, 0, 0.35) 30%,
                rgba(0, 0, 0, 0.45) 50%,
                rgba(0, 0, 0, 0.35) 70%,
                rgba(0, 0, 0, 0.0) 100%
            );
            z-index: 2;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.7) 0%,
                rgba(0, 0, 0, 0.0) 100%
            );
            z-index: 2;
        }

        /* Main text content */
        .text-content {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -60%);
            z-index: 10;
            text-align: left;
            width: 90%;
            padding-left: 20px;
        }

        .main-heading {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 128px;
            line-height: 0.92;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: -3px;
            text-shadow: 
                0 2px 20px rgba(0, 0, 0, 0.6),
                0 4px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 10px;
        }

        .sub-heading {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-style: italic;
            font-size: 82px;
            line-height: 1.1;
            color: #d4a843;
            text-shadow: 
                0 2px 15px rgba(0, 0, 0, 0.7),
                0 4px 30px rgba(0, 0, 0, 0.5);
            margin-top: 5px;
        }

        /* Bottom bar */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            align-items: center;
            z-index: 10;
            background: linear-gradient(
                90deg,
                rgba(30, 30, 30, 0.95) 0%,
                rgba(25, 25, 25, 0.95) 100%
            );
            border-top: 3px solid;
            border-image: linear-gradient(
                90deg,
                #c9a84c 0%,
                #d4b45a 50%,
                #c9a84c 100%
            ) 1;
        }

        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 40px;
            margin-right: 30px;
        }

        .logo-text {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 36px;
            letter-spacing: 8px;
            color: #ffffff;
            line-height: 1;
        }

        .logo-subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 7px;
            color: #c9a84c;
            margin-top: 2px;
        }

        .divider-line {
            width: 2px;
            height: 50px;
            background: linear-gradient(180deg, #c9a84c, #8a7030);
            margin-right: 30px;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 400;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.5px;
        }

        /* ============================================= */
        /* VARIANT SELECTOR - za lako menjanje varijanti */
        /* ============================================= */
        .variant-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 12px;
            z-index: 1000;
            color: white;
            font-size: 14px;
            max-width: 300px;
        }

        .variant-controls h3 {
            margin-bottom: 15px;
            color: #d4a843;
            font-size: 16px;
        }

        .variant-btn {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin: 5px 0;
            background: rgba(212, 168, 67, 0.15);
            border: 1px solid rgba(212, 168, 67, 0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }

        .variant-btn:hover, .variant-btn.active {
            background: rgba(212, 168, 67, 0.35);
            border-color: #d4a843;
        }

        .variant-btn.active {
            border-color: #d4a843;
            box-shadow: 0 0 10px rgba(212, 168, 67, 0.3);
        }

        .hide-controls {
            display: block;
            margin-top: 12px;
            padding: 8px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 12px;
        }

        @media print {
            .variant-controls { display: none; }
            body { padding: 0; background: white; }
        }
    </style>
</head>
<body>

    <!-- Variant Controls Panel -->
    <div class="variant-controls" id="controls">
        <h3>⚡ Varijante teksta</h3>
        <button class="variant-btn active" onclick="setVariant(1)">
            1. PRODAJETE NEKRETNINU? → u Novom Sadu
        </button>
        <button class="variant-btn" onclick="setVariant(2)">
            2. PRODAJETE STAN? → Prepustite to nama
        </button>
        <button class="variant-btn" onclick="setVariant(3)">
            3. VAŠ STAN. → Naš zadatak.
        </button>
        <button class="variant-btn" onclick="setVariant(4)">
            4. PRODAJA NEKRETNINE? → Brzo, sigurno, efikasno
        </button>
        <button class="variant-btn" onclick="setVariant(5)">
            5. ŽELITE PRODATI? → Mi pronalazimo kupca
        </button>
        <button class="hide-controls" onclick="toggleControls()">Sakrij/Prikaži kontrole</button>
    </div>

    <!-- Main Creative -->
    <div class="creative-container" id="creative">
        <!-- Background Image -->
        <img class="bg-image" src="/Users/andrijalazukic/.gemini/antigravity/brain/db4e4dfa-23c1-49e1-8736-4100356c4fc1/novisad_drone_sunset_1779386829878.png" alt="Novi Sad aerial view">
        
        <!-- Overlays -->
        <div class="overlay-top"></div>
        <div class="overlay-center"></div>
        <div class="overlay-bottom"></div>

        <!-- Main Text -->
        <div class="text-content">
            <div class="main-heading" id="mainText">PRODAJETE<br>NEKRETNINU?</div>
            <div class="sub-heading" id="subText">u Novom Sadu</div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="logo-area">
                <div class="logo-text">APEX</div>
                <div class="logo-subtitle">REAL ESTATE</div>
            </div>
            <div class="divider-line"></div>
            <div class="tagline" id="taglineText">Od oglasa do prodaje — sve na jednom mestu</div>
        </div>
    </div>

    <script>
        const variants = {
            1: {
                main: 'PRODAJETE<br>NEKRETNINU?',
                sub: 'u Novom Sadu',
                tagline: 'Od oglasa do prodaje — sve na jednom mestu'
            },
            2: {
                main: 'PRODAJETE<br>STAN?',
                sub: 'Prepustite to nama',
                tagline: 'Vaša nekretnina, naš prioritet'
            },
            3: {
                main: 'VAŠ STAN.',
                sub: 'Naš zadatak.',
                tagline: 'Vi se opustite, mi se brinemo o svemu'
            },
            4: {
                main: 'PRODAJA<br>NEKRETNINE?',
                sub: 'Brzo, sigurno, efikasno',
                tagline: 'Besplatna konsultacija • 064 333 5757'
            },
            5: {
                main: 'ŽELITE<br>PRODATI?',
                sub: 'Mi pronalazimo kupca',
                tagline: 'Profesionalna podrška od početka do kraja'
            }
        };

        function setVariant(num) {
            const v = variants[num];
            document.getElementById('mainText').innerHTML = v.main;
            document.getElementById('subText').textContent = v.sub;
            document.getElementById('taglineText').textContent = v.tagline;
            
            // Update active button
            document.querySelectorAll('.variant-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === num - 1);
            });
        }

        function toggleControls() {
            const controls = document.getElementById('controls');
            const btns = controls.querySelectorAll('.variant-btn, h3');
            btns.forEach(el => {
                el.style.display = el.style.display === 'none' ? '' : 'none';
            });
        }
    </script>

</body>
</html>
