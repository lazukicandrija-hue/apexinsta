<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>APEX Story — Vaš Novi Dom</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; }

        .story {
            width: 1080px; height: 1920px; position: relative;
            background: linear-gradient(180deg, #0d0b08 0%, #0a0a0a 40%, #0d0b08 100%);
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        /* Multiple warm glows */
        .g1 { position: absolute; top: 25%; left: 50%; transform: translate(-50%,-50%); width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(184,148,74,0.08) 0%, transparent 60%); }
        .g2 { position: absolute; top: 55%; left: 30%; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(184,148,74,0.05) 0%, transparent 70%); }
        .g3 { position: absolute; top: 55%; right: 20%; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(184,148,74,0.04) 0%, transparent 70%); }
        .g4 { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(184,148,74,0.06) 0%, transparent 60%); }

        .logo { margin-top: 130px; z-index: 2; }
        .logo img { width: 200px; height: 200px; object-fit: contain; filter: drop-shadow(0 6px 50px rgba(184,148,74,0.3)); }

        /* House icon */
        .house-icon {
            margin-top: 100px; z-index: 2;
            width: 180px; height: 180px; position: relative;
        }
        .house-roof {
            width: 0; height: 0;
            border-left: 90px solid transparent; border-right: 90px solid transparent;
            border-bottom: 70px solid transparent;
            position: absolute; top: 0; left: 0;
        }
        .house-roof::after {
            content: ''; position: absolute;
            top: -2px; left: -90px;
            width: 0; height: 0;
            border-left: 90px solid transparent; border-right: 90px solid transparent;
            border-bottom: 70px solid rgba(184,148,74,0.15);
        }
        .house-roof-outline {
            position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
            width: 160px; height: 65px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border: 1.5px solid rgba(184,148,74,0.4);
            background: transparent;
        }
        /* Use SVG for cleaner house */
        .house-svg {
            margin-top: 80px; z-index: 2;
        }
        .house-svg svg {
            width: 160px; height: 160px;
            stroke: rgba(184,148,74,0.5); stroke-width: 1.5; fill: none;
            filter: drop-shadow(0 0 20px rgba(184,148,74,0.15));
        }

        /* Main text */
        .main-text { margin-top: 70px; text-align: center; z-index: 2; }
        .text-white {
            font-family: 'Cormorant Garamond', serif; font-weight: 400;
            font-size: 82px; color: #ffffff; line-height: 1.1;
        }
        .text-gold {
            font-family: 'Cormorant Garamond', serif; font-weight: 400; font-style: italic;
            font-size: 68px; color: #d4af5a; line-height: 1.3;
        }

        /* Separator */
        .sep {
            margin-top: 60px; z-index: 2;
            width: 180px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(184,148,74,0.4), transparent);
            position: relative;
        }
        .sep::after {
            content: '◆'; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px; color: rgba(184,148,74,0.4);
            background: #0a0a0a; padding: 0 12px;
        }

        /* Body text */
        .body-text {
            margin-top: 50px; z-index: 2; text-align: center; padding: 0 120px;
            font-weight: 300; font-size: 22px; line-height: 1.7;
            color: rgba(255,255,255,0.4);
        }

        /* CTA */
        .cta-area { z-index: 2; margin-top: auto; margin-bottom: 180px; display: flex; flex-direction: column; align-items: center; gap: 25px; }
        .cta-btn {
            padding: 28px 75px; border-radius: 60px;
            background: linear-gradient(135deg, #B8944A 0%, #d4af5a 50%, #c9a84e 100%);
            font-weight: 600; font-size: 20px; letter-spacing: 3px; text-transform: uppercase;
            color: #0a0a0a; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 8px 50px rgba(184,148,74,0.3), 0 2px 15px rgba(184,148,74,0.2);
        }
        .cta-btn svg { width: 20px; height: 20px; stroke: #0a0a0a; stroke-width: 2.5; fill: none; }
        .cta-web { font-weight: 300; font-size: 15px; color: rgba(184,148,74,0.35); letter-spacing: 2px; }

        /* Particles */
        .particle {
            position: absolute; border-radius: 50%; background: rgba(184,148,74,0.15);
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 0.3; }
        }

        .noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); pointer-events: none; }
    </style>
</head>
<body>
<div class="story">
    <div class="noise"></div>
    <div class="g1"></div><div class="g2"></div><div class="g3"></div><div class="g4"></div>

    <!-- Floating particles -->
    <div class="particle" style="width:4px;height:4px;top:15%;left:20%;animation-delay:0s;"></div>
    <div class="particle" style="width:3px;height:3px;top:25%;right:15%;animation-delay:1s;"></div>
    <div class="particle" style="width:5px;height:5px;top:40%;left:12%;animation-delay:2s;"></div>
    <div class="particle" style="width:3px;height:3px;top:50%;right:22%;animation-delay:0.5s;"></div>
    <div class="particle" style="width:4px;height:4px;top:65%;left:25%;animation-delay:3s;"></div>
    <div class="particle" style="width:3px;height:3px;top:35%;left:80%;animation-delay:1.5s;"></div>
    <div class="particle" style="width:5px;height:5px;top:70%;right:10%;animation-delay:2.5s;"></div>
    <div class="particle" style="width:3px;height:3px;top:80%;left:15%;animation-delay:4s;"></div>
    <div class="particle" style="width:4px;height:4px;top:20%;left:60%;animation-delay:3.5s;"></div>
    <div class="particle" style="width:3px;height:3px;top:58%;left:85%;animation-delay:1.2s;"></div>

    <div class="logo"><img src="logo-transparent.png" alt="APEX"></div>

    <!-- House icon (SVG) -->
    <div class="house-svg">
        <svg viewBox="0 0 100 100">
            <path d="M50 10 L10 45 L10 90 L40 90 L40 65 L60 65 L60 90 L90 90 L90 45 Z" />
            <rect x="44" y="28" width="12" height="12" rx="1" />
        </svg>
    </div>

    <div class="main-text">
        <div class="text-white">Vaš novi dom</div>
        <div class="text-gold">vas čeka.</div>
    </div>

    <div class="sep"></div>

    <div class="body-text">
        Od pretrage do useljenja —<br>tu smo za vas na svakom koraku.
    </div>

    <div class="cta-area">
        <div class="cta-btn">
            Započnite pretragu
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <div class="cta-web">www.apexrealestate.rs</div>
    </div>
</div>
</body>
</html>
