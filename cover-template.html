<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX Real Estate — Instagram Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1080px;
            height: 1350px;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }

        .cover {
            width: 1080px;
            height: 1350px;
            position: relative;
            background: linear-gradient(165deg, #111111 0%, #0a0a0a 40%, #0d0b08 100%);
            overflow: hidden;
        }

        /* === LARGE GEOMETRIC GOLD TRIANGLE (echoes logo shape) === */
        .geo-triangle {
            position: absolute;
            top: -200px;
            right: -150px;
            width: 700px;
            height: 700px;
            background: linear-gradient(135deg, rgba(184, 148, 74, 0.07) 0%, rgba(184, 148, 74, 0.02) 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: rotate(15deg);
        }

        .geo-triangle-stroke {
            position: absolute;
            top: -180px;
            right: -130px;
            width: 680px;
            height: 680px;
            border: 1px solid rgba(184, 148, 74, 0.08);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: rotate(15deg);
        }

        /* === DIAGONAL GOLD ACCENT BAR === */
        .diagonal-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .diagonal-bar::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 72%;
            width: 2px;
            height: 200%;
            background: linear-gradient(180deg, transparent 0%, rgba(184, 148, 74, 0.3) 30%, rgba(184, 148, 74, 0.15) 70%, transparent 100%);
            transform: rotate(-25deg);
        }

        .diagonal-bar::after {
            content: '';
            position: absolute;
            top: -50%;
            left: 75%;
            width: 1px;
            height: 200%;
            background: linear-gradient(180deg, transparent 0%, rgba(184, 148, 74, 0.1) 30%, rgba(184, 148, 74, 0.05) 70%, transparent 100%);
            transform: rotate(-25deg);
        }

        /* === FLOATING DOTS PATTERN === */
        .dot-grid {
            position: absolute;
            bottom: 100px;
            left: 50px;
            display: grid;
            grid-template-columns: repeat(5, 12px);
            grid-template-rows: repeat(5, 12px);
            gap: 8px;
            opacity: 0.15;
        }

        .dot-grid span {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #B8944A;
        }

        /* === CIRCLE GLOW === */
        .circle-glow {
            position: absolute;
            bottom: -200px;
            left: -200px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(184, 148, 74, 0.06) 0%, transparent 70%);
        }

        /* === SMALL TOP ACCENT === */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #B8944A 0%, #d4af5a 50%, #B8944A 100%);
        }

        /* === LOGO === */
        .logo-wrap {
            position: absolute;
            top: 80px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            width: 420px;
            height: 420px;
            object-fit: contain;
            filter: drop-shadow(0 4px 60px rgba(184, 148, 74, 0.25));
        }

        /* === MAIN CONTENT CARD (glassmorphism) === */
        .content-card {
            position: absolute;
            bottom: 120px;
            left: 70px;
            right: 70px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(184, 148, 74, 0.12);
            border-radius: 20px;
            padding: 50px 55px 45px;
        }

        /* Tag / badge */
        .tag {
            display: inline-block;
            padding: 8px 22px;
            background: linear-gradient(135deg, #B8944A, #d4af5a);
            border-radius: 50px;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #0a0a0a;
            margin-bottom: 28px;
        }

        /* Location title */
        .location {
            font-family: 'DM Serif Display', serif;
            font-size: 52px;
            color: #ffffff;
            line-height: 1.15;
            margin-bottom: 30px;
            max-width: 600px;
        }

        /* Details row */
        .details-row {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .detail {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .detail-num {
            font-weight: 700;
            font-size: 36px;
            color: #ffffff;
            line-height: 1;
        }

        .detail-unit {
            font-weight: 300;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        .detail-sep {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(184, 148, 74, 0.5);
        }

        /* Divider line */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(184, 148, 74, 0.3), rgba(184, 148, 74, 0.05));
            margin-bottom: 25px;
        }

        /* Price row */
        .price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .price {
            font-weight: 800;
            font-size: 46px;
            background: linear-gradient(135deg, #d4af5a 0%, #B8944A 50%, #c9a84e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .swipe {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 400;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
        }

        .swipe-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(184, 148, 74, 0.3);
        }

        .swipe-arrow svg {
            width: 14px;
            height: 14px;
            stroke: #B8944A;
            stroke-width: 2.5;
            fill: none;
        }

        /* Vertical text on right side */
        .side-text {
            position: absolute;
            top: 50%;
            right: 25px;
            transform: translateY(-50%) rotate(90deg);
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(184, 148, 74, 0.2);
            white-space: nowrap;
        }

        /* Small circle accent near logo */
        .circle-ring {
            position: absolute;
            top: 400px;
            left: 80px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 1px solid rgba(184, 148, 74, 0.1);
        }

        .circle-ring-sm {
            position: absolute;
            top: 440px;
            left: 120px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid rgba(184, 148, 74, 0.06);
        }
    </style>
</head>
<body>

<div class="cover">
    <!-- Background elements -->
    <div class="geo-triangle"></div>
    <div class="geo-triangle-stroke"></div>
    <div class="diagonal-bar"></div>
    <div class="circle-glow"></div>
    <div class="top-bar"></div>

    <!-- Decorative elements -->
    <div class="circle-ring"></div>
    <div class="circle-ring-sm"></div>
    <div class="dot-grid">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Side text -->
    <div class="side-text">Apex Real Estate</div>

    <!-- Logo -->
    <div class="logo-wrap">
        <img src="logo-transparent.png" alt="APEX Real Estate" class="logo-img">
    </div>

    <!-- Main content card -->
    <div class="content-card">
        <!-- Tag -->
        <div class="tag" id="tagText">Na prodaju</div>

        <!-- Location -->
        <div class="location" id="locationText">Centar, Novi Sad</div>

        <!-- Details -->
        <div class="details-row">
            <div class="detail">
                <span class="detail-num" id="sizeText">126</span>
                <span class="detail-unit">m²</span>
            </div>
            <div class="detail-sep"></div>
            <div class="detail">
                <span class="detail-num" id="floorText">3.</span>
                <span class="detail-unit">sprat</span>
            </div>
            <div class="detail-sep"></div>
            <div class="detail">
                <span class="detail-num" id="roomsText">4</span>
                <span class="detail-unit">sobe</span>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Price row -->
        <div class="price-row">
            <div class="price" id="priceText">185.000 €</div>
            <div class="swipe">
                Slike
                <div class="swipe-arrow">
                    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    /* =============================================
       🏠 MARKO — MENJAJ SAMO OVO DOLE! 🏠
       =============================================
       
       Sačuvaj → otvori u Chrome → screenshot 1080×1350
       ============================================= */

    const nekretnina = {
        lokacija:    "Centar, Novi Sad",    // ← Adresa/lokacija
        kvadratura:  "126",                  // ← Kvadratura (samo broj)
        sprat:       "3.",                   // ← Sprat (npr: "1.", "PR", "VP")
        sobe:        "4",                    // ← Broj soba
        cena:        "185.000 €",            // ← Cena
        tip:         "Na prodaju"            // ← "Na prodaju" ili "Izdavanje"
    };

    // Primeni podatke automatski
    document.getElementById('locationText').textContent = nekretnina.lokacija;
    document.getElementById('sizeText').textContent     = nekretnina.kvadratura;
    document.getElementById('floorText').textContent    = nekretnina.sprat;
    document.getElementById('roomsText').textContent    = nekretnina.sobe;
    document.getElementById('priceText').textContent    = nekretnina.cena;
    document.getElementById('tagText').textContent      = nekretnina.tip;
</script>

</body>
</html>
