<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<title>APEX Real Estate — Cover V8 Golden Ring</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Inter', sans-serif;
    color: #fff;
    position: relative;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 700px 700px at 540px 470px, rgba(184,148,74,0.08) 0%, rgba(184,148,74,0.03) 40%, transparent 70%),
      radial-gradient(ellipse 1200px 1200px at 540px 470px, rgba(20,18,12,1) 0%, #0a0a0a 100%);
  }

  /* ── Radial decorative lines ── */
  .radial-lines {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform: translate(-50%, -8%);
    z-index: 1;
  }

  .radial-line {
    position: absolute;
    top: 0;
    left: -0.5px;
    width: 1px;
    height: 340px;
    background: linear-gradient(to bottom, rgba(184,148,74,0.0) 0%, rgba(184,148,74,0.07) 40%, rgba(184,148,74,0.02) 100%);
    transform-origin: top center;
  }

  /* ── Main gold ring ── */
  .gold-ring-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -8%);
    z-index: 5;
  }

  .gold-ring {
    width: 480px;
    height: 480px;
    border-radius: 50%;
    border: 1.8px solid rgba(184,148,74,0.7);
    position: relative;
    box-shadow:
      0 0 40px rgba(184,148,74,0.10),
      0 0 80px rgba(184,148,74,0.06),
      inset 0 0 40px rgba(184,148,74,0.04);
  }

  /* Outer glow ring */
  .gold-ring::before {
    content: '';
    position: absolute;
    top: -14px; left: -14px;
    right: -14px; bottom: -14px;
    border-radius: 50%;
    border: 1px solid rgba(184,148,74,0.12);
  }

  /* Inner glow ring */
  .gold-ring::after {
    content: '';
    position: absolute;
    top: 10px; left: 10px;
    right: 10px; bottom: 10px;
    border-radius: 50%;
    border: 1px solid rgba(184,148,74,0.08);
  }

  /* ── Logo ── */
  .logo-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-wrap img {
    width: 280px;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(184,148,74,0.15));
  }

  /* ── Na prodaju label ── */
  .label-sale {
    position: absolute;
    z-index: 15;
    top: 0;
    left: 50%;
    transform: translate(-50%, -54px);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 4.5px;
    text-transform: uppercase;
    color: #B8944A;
    background: rgba(184,148,74,0.08);
    border: 1px solid rgba(184,148,74,0.25);
    padding: 8px 28px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* ── Location text below ring ── */
  .location {
    position: absolute;
    z-index: 15;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'DM Serif Display', serif;
    font-size: 34px;
    color: #ffffff;
    letter-spacing: 1px;
    white-space: nowrap;
    text-align: center;
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  .location .dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #B8944A;
    margin: 0 14px;
    vertical-align: middle;
    position: relative;
    top: -2px;
  }

  /* ── Satellite stat badges ── */
  .stat-badge {
    position: absolute;
    z-index: 20;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(10,10,10,0.85);
    border: 1.2px solid rgba(184,148,74,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(184,148,74,0.06);
    backdrop-filter: blur(4px);
  }

  .stat-badge .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: #d4af5a;
    line-height: 1;
  }

  .stat-badge .stat-label {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-top: 5px;
  }

  /* Badge positions — 5 o'clock, 7 o'clock, bottom-center */
  .stat-badge.pos-5 {
    /* ~5 o'clock on a 480px ring */
    top: 50%;
    left: 50%;
    transform: translate(190px, 120px) translate(-50%, -50%);
  }

  .stat-badge.pos-7 {
    /* ~7 o'clock */
    top: 50%;
    left: 50%;
    transform: translate(-190px, 120px) translate(-50%, -50%);
  }

  .stat-badge.pos-bottom {
    /* bottom dead-center, below ring */
    top: 50%;
    left: 50%;
    transform: translate(0px, 210px) translate(-50%, -50%);
  }

  /* Thin connector lines from ring to badges */
  .connector {
    position: absolute;
    z-index: 4;
    background: rgba(184,148,74,0.15);
  }

  .connector-5 {
    width: 1px;
    height: 60px;
    top: 50%;
    left: 50%;
    transform-origin: top center;
    transform: translate(-50%, 0) translate(140px, 190px) rotate(-30deg);
  }

  .connector-7 {
    width: 1px;
    height: 60px;
    top: 50%;
    left: 50%;
    transform-origin: top center;
    transform: translate(-50%, 0) translate(-140px, 190px) rotate(30deg);
  }

  .connector-b {
    width: 1px;
    height: 50px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, 215px);
  }

  /* ── Price ── */
  .price-section {
    position: absolute;
    z-index: 15;
    bottom: 105px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
  }

  .price-amount {
    font-family: 'DM Serif Display', serif;
    font-size: 52px;
    color: #d4af5a;
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 0 30px rgba(184,148,74,0.15);
  }

  .price-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 10px;
  }

  /* ── Swipe hint ── */
  .swipe-hint {
    position: absolute;
    z-index: 20;
    bottom: 36px;
    right: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0.35;
  }

  .swipe-hint span {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }

  .swipe-hint .arrow {
    display: flex;
    align-items: center;
  }

  .swipe-hint .arrow svg {
    width: 18px;
    height: 18px;
  }

  /* ── Decorative corner marks ── */
  .corner {
    position: absolute;
    z-index: 10;
    width: 40px;
    height: 40px;
  }

  .corner::before,
  .corner::after {
    content: '';
    position: absolute;
    background: rgba(184,148,74,0.2);
  }

  .corner-tl { top: 48px; left: 48px; }
  .corner-tl::before { top: 0; left: 0; width: 20px; height: 1px; }
  .corner-tl::after  { top: 0; left: 0; width: 1px; height: 20px; }

  .corner-tr { top: 48px; right: 48px; }
  .corner-tr::before { top: 0; right: 0; width: 20px; height: 1px; }
  .corner-tr::after  { top: 0; right: 0; width: 1px; height: 20px; }

  .corner-bl { bottom: 48px; left: 48px; }
  .corner-bl::before { bottom: 0; left: 0; width: 20px; height: 1px; }
  .corner-bl::after  { bottom: 0; left: 0; width: 1px; height: 20px; }

  .corner-br { bottom: 48px; right: 48px; }
  .corner-br::before { bottom: 0; right: 0; width: 20px; height: 1px; }
  .corner-br::after  { bottom: 0; right: 0; width: 1px; height: 20px; }

  /* ── Subtle noise texture overlay ── */
  .noise {
    position: absolute;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  /* ── Kvadratura separator ── */
  .kv-sep {
    display: inline-block;
    width: 30px;
    height: 1px;
    background: rgba(184,148,74,0.3);
    vertical-align: middle;
    margin: 0 16px;
  }

  /* ── Kvadratura line ── */
  .kv-line {
    position: absolute;
    z-index: 15;
    bottom: 176px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0;
    white-space: nowrap;
  }

  .kv-line .kv-value {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: rgba(255,255,255,0.7);
  }

  .kv-line .kv-unit {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 1px;
    margin-left: 4px;
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Noise overlay -->
  <div class="noise"></div>

  <!-- Corner marks -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Radial lines container -->
  <div class="radial-lines" id="radialLines"></div>

  <!-- Main gold ring -->
  <div class="gold-ring-wrap">
    <!-- Na prodaju label -->
    <div class="label-sale" id="labelSale">Na prodaju</div>

    <div class="gold-ring">
      <!-- Logo centered inside -->
      <div class="logo-wrap">
        <img src="logo-transparent.png" alt="APEX Real Estate">
      </div>
    </div>

    <!-- Location below the ring -->
    <div class="location" id="lokacija">Centar, Novi Sad</div>

    <!-- Satellite stat badges -->
    <div class="stat-badge pos-5" id="badgeSobe">
      <span class="stat-value" id="sobeVal">4</span>
      <span class="stat-label">Sobe</span>
    </div>

    <div class="stat-badge pos-7" id="badgeSprat">
      <span class="stat-value" id="spratVal">3.</span>
      <span class="stat-label">Sprat</span>
    </div>

    <div class="stat-badge pos-bottom" id="badgeKv">
      <span class="stat-value" id="kvVal">126</span>
      <span class="stat-label">m²</span>
    </div>
  </div>

  <!-- Price section -->
  <div class="price-section">
    <div class="price-amount" id="cena">185.000 €</div>
    <div class="price-label">Cena</div>
  </div>

  <!-- Swipe hint -->
  <div class="swipe-hint">
    <span>Prevuci</span>
    <div class="arrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </div>
  </div>

</div>

<script>
  // ═══════════════════════════════════════════
  //  IZMENI PODATKE O NEKRETNINI OVDE:
  // ═══════════════════════════════════════════

  const nekretnina = {
      lokacija:    "Centar, Novi Sad",
      kvadratura:  "126",
      sprat:       "3.",
      sobe:        "4",
      cena:        "185.000 €",
      tip:         "Na prodaju"
  };

  // ═══════════════════════════════════════════

  // Apply data to DOM
  document.getElementById('lokacija').textContent = nekretnina.lokacija;
  document.getElementById('kvVal').textContent     = nekretnina.kvadratura;
  document.getElementById('spratVal').textContent  = nekretnina.sprat;
  document.getElementById('sobeVal').textContent   = nekretnina.sobe;
  document.getElementById('cena').textContent      = nekretnina.cena;
  document.getElementById('labelSale').textContent = nekretnina.tip;

  // Generate radial decorative lines
  (function() {
    const container = document.getElementById('radialLines');
    const lineCount = 72;
    for (let i = 0; i < lineCount; i++) {
      const angle = (360 / lineCount) * i;
      const line = document.createElement('div');
      line.className = 'radial-line';
      line.style.transform = `rotate(${angle}deg)`;
      // Vary opacity for organic feel
      const opacityVariation = 0.5 + Math.random() * 0.5;
      line.style.opacity = opacityVariation;
      container.appendChild(line);
    }
  })();
</script>
</body>
</html>
